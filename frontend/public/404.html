<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SAT-SA</title>

  <script>
    const base = "/SAT-SA";

    const redirect =
      window.location.pathname.replace(base, "") +
      window.location.search +
      window.location.hash;

    sessionStorage.setItem("sat-sa-redirect", redirect);

    window.location.replace(base + "/");
  </script>
</head>

</html>
