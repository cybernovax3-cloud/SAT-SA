<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAT-SA</title>

  <script>
    (function () {
      const base = '/SAT-SA';
      const path = window.location.pathname;

      // Do NOT redirect missing assets/files.
      // Only handle React application routes.
      if (
        path.startsWith(base) &&
        !path.startsWith(base + '/assets/') &&
        !path.endsWith('.js') &&
        !path.endsWith('.css') &&
        !path.endsWith('.png') &&
        !path.endsWith('.jpg') &&
        !path.endsWith('.jpeg') &&
        !path.endsWith('.svg') &&
        !path.endsWith('.ico') &&
        !path.endsWith('.json') &&
        !path.endsWith('.webp') &&
        !path.endsWith('.woff') &&
        !path.endsWith('.woff2')
      ) {
        const route = path.slice(base.length) || '/';

        sessionStorage.setItem(
          'sat-sa-redirect',
          route + window.location.search + window.location.hash
        );

        window.location.replace(base + '/');
      }
    })();
  </script>
</head>

<body>
  <p>SAT-SA</p>
</body>
</html>
