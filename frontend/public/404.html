<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAT-SA</title>

  <script>
    (function () {
      const base = '/SAT-SA';
      const path = window.location.pathname;

      // Only handle React routes
      if (
        path.startsWith(base) &&
        !path.startsWith(base + '/assets/') &&
        !path.match(/\.[^/]+$/)
      ) {
        const route = path.slice(base.length) || '/';

        sessionStorage.setItem(
          'sat-sa-redirect',
          route + window.location.search + window.location.hash
        );

        window.location.replace(base + '/');
      }
    })();
  </script>
</head>

<body>
  <p>Loading SAT-SA...</p>
</body>
</html>
